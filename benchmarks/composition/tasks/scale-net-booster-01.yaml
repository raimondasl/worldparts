notes: |
  Outline: each pump follows exactly H = 66 - Q^2/500. The open fraction falls from 0.20 to
  0.05 by 3 h: one pump, and the header rises to 6.70 bar, the day's maximum, 0.2 bar above
  pump 2's stop point. It ramps up to 1.0 between 5 and 8 h: pump 2 starts at 5.63 h when the
  header falls below 4.25 bar (the header jumps to 5.86 bar), and pump 3 starts at 6.58 h
  below 4.05 bar (the header jumps to 5.15 bar). At 1.0, until 10 h, the three pumps deliver
  373 m3/h and the header falls to its minimum, 3.79 bar, 0.26 bar below pump 3's start point,
  while N9, the highest node at 18 m, falls to 1.04 bar. The fraction then eases to 0.5
  (header 5.3 bar, three pumps) and 0.8 (header 4.2 bar) and ramps down to 0.2 between 21 and
  24 h; pump 3 stops at 23.22 h above 5.80 bar (the header drops to 5.02 bar). Pump 2 runs
  from 5.63 h to the end. Every switch changes one pump, and the state after it lies inside
  every dead band by 0.15 bar or more, so a controller that cascades within a step (EPANET)
  gives the same states as one pass per step. The extremes are plateaus, not switching points:
  the pressures just before a start (4.25 and 4.05 bar) lie above the peak minimum and those
  just before a stop (5.80 bar) below the night maximum. The reservoir (2827 m2) falls from
  4.5 m to 2.45 m, about 5800 m3 delivered (the 0.1 m tolerance on its final depth is 5 % of
  the drawdown).

  Independent check without worldparts: WNTR 1.5.0 EpanetSimulator (EPANET 2.2) built from the
  prompt tables, one EPANET run per 60 s step (the emitter coefficients follow the linear
  schedule): Darcy-Weisbach headloss (Swamee-Jain), relative viscosity 0.9823, accuracy 1e-7,
  the reservoir an EPANET tank whose level is carried from step to step, every outlet an
  emitter of coefficient 0.6 f A sqrt(2 g), each pump a three-point curve through (0, 66),
  (100, 46) and (140, 26.8). The staging was applied in Python at each step as the prompt
  states (a snapshot gives the header pressure, both pumps are switched from it, then the 60 s
  run with the new states is recorded), because WNTR's junction-pressure controls did not act
  in this EPANET build. EPANET stages at 5.633, 6.583 and 23.217 h, as the reference does.
  EPANET against the reference: highest header pressure 6.696 against 6.696 bar (+0.001 %),
  lowest 3.794 against 3.794 bar (-0.005 %), lowest at N9 1.038 against 1.038 bar (+0.04 %),
  highest station flow 373.34 against 373.31 m3/h (+0.01 %), reservoir at 24 h 2.453 against
  2.453 m (-0.0003 m). All within 0.05 %.

  Energy is not asked: the worldparts tools report the minimum, maximum and final value of
  each simulated variable but no time integral, so an agent without code could not total the
  pumps' energy; the reservoir's final depth carries the delivered volume instead.

  Reference timing (worldparts, warm catalogue): load 0.014 s, 24 h simulation at 60 s (1441
  samples, the ramps expanded to one change per step) 3.3 to 3.6 s for the 30 components and
  two controls.
