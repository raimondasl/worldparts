        - {at: 17 h, ramp: {out_n1.opening: [0.5, 0.8], out_n2.opening: [0.5, 0.8], out_n3.opening: [0.5, 0.8], out_n4.opening: [0.5, 0.8], out_n5.opening: [0.5, 0.8], out_n6.opening: [0.5, 0.8], out_n7.opening: [0.5, 0.8], out_n8.opening: [0.5, 0.8], out_n9.opening: [0.5, 0.8]}, over: 2 h}
        - {at: 21 h, ramp: {out_n1.opening: [0.8, 0.2], out_n2.opening: [0.8, 0.2], out_n3.opening: [0.8, 0.2], out_n4.opening: [0.8, 0.2], out_n5.opening: [0.8, 0.2], out_n6.opening: [0.8, 0.2], out_n7.opening: [0.8, 0.2], out_n8.opening: [0.8, 0.2], out_n9.opening: [0.8, 0.2]}, over: 3 h}
