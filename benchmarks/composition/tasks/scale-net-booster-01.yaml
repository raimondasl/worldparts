id: scale-net-booster-01
title: Three-pump booster staged by header pressure over 24 h
level: 4
category: transient
domain: pumping
prompt: |
  A booster station with three identical pumps supplies a looped network. Pump 1 runs all day;
  pumps 2 and 3 are staged on and off by the header pressure. Follow the system through one
  day, 0 h to 24 h.

  Station. The pumps draw from a clear-water reservoir, an open vertical cylinder of 60 m
  inner diameter and 5.0 m height with 4.5 m of water at 0 h and no inflow during the day. The
  reservoir floor, the pumps, the suction manifold S and the discharge header HDR are at
  elevation 0 m. A suction pipe (30 m, 300 mm, K = 1.0) joins the reservoir's bottom outlet to
  S. Each pump runs from S through its own non-return valve (negligible loss) into HDR; a
  stopped pump passes no flow. Each pump, at its fixed speed: head 66 m at 0 m3/h, 61 m at 50
  m3/h, 46 m at 100 m3/h and 26.8 m at 140 m3/h (exactly H = 66 - Q^2/500, Q in m3/h per
  pump). The header pressure is the gauge pressure at HDR.

  | Pipe | From | To | Length (m) | Inner diameter (mm) |
  |---|---|---|---:|---:|
  | trunk | HDR | N1 | 800 | 300 |
  | N1-N2 | N1 | N2 | 450 | 250 |
  | N2-N3 | N2 | N3 | 500 | 150 |
  | N1-N4 | N1 | N4 | 400 | 200 |
  | N2-N5 | N2 | N5 | 420 | 200 |
  | N3-N6 | N3 | N6 | 400 | 150 |
  | N4-N5 | N4 | N5 | 480 | 150 |
  | N5-N6 | N5 | N6 | 450 | 150 |
  | N4-N7 | N4 | N7 | 380 | 150 |
  | N5-N8 | N5 | N8 | 400 | 150 |
  | N6-N9 | N6 | N9 | 420 | 100 |
  | N7-N8 | N7 | N8 | 460 | 100 |
  | N8-N9 | N8 | N9 | 440 | 100 |

  | Node | Elevation (m) | Outlet orifice diameter (mm) |
  |---|---:|---:|
  | N1 | 4.0 | 33 |
  | N2 | 8.0 | 39 |
  | N3 | 12.0 | 33 |
  | N4 | 6.0 | 36 |
  | N5 | 10.0 | 39 |
  | N6 | 15.0 | 33 |
  | N7 | 9.0 | 36 |
  | N8 | 13.0 | 36 |
  | N9 | 18.0 | 30 |

  All pipes have a roughness of 0.1 mm and no minor losses except the suction pipe's K. The
  reservoir connection is lossless: the pressure at its floor is rho g times its water depth.
  Demand is pressure-driven: the consumers at each network node act as one orifice discharging
  to atmosphere at the node's elevation, Q = 0.6 x f x A x sqrt(2 p / rho), with A = pi d^2 /
  4 from the table, p the node's gauge pressure and f the open fraction of the outlets. All
  outlets share one schedule of f, which varies linearly in time between these points:

  | Time (h) | Open fraction |
  |---:|---:|
  | 0 | 0.20 |
  | 3 | 0.05 |
  | 5 | 0.05 |
  | 8 | 1.00 |
  | 10 | 1.00 |
  | 13 | 0.50 |
  | 17 | 0.50 |
  | 19 | 0.80 |
  | 21 | 0.80 |
  | 24 | 0.20 |

  Staging. Pumps 2 and 3 are stopped at 0 h. The header pressure is checked every 60 s, and
  both pumps are switched from the same reading: pump 2 starts when the header pressure is
  below 4.25 bar and stops when it is above 6.50 bar; pump 3 starts when the header pressure
  is below 4.05 bar and stops when it is above 5.80 bar; otherwise each keeps its state.

  Time stepping. Use a 60 s step from 0 h to 24 h. At each step (including 0 h) apply the open
  fraction for that time, solve the network as quasi-steady for the current reservoir level
  and pump states, then check the staging; if a pump changes state, solve again. That final
  solution is the state at that time; its outflow is held for the next 60 s to update the
  reservoir level (explicit Euler). Minima and maxima are taken over these states at every
  step from 0 h to 24 h.

  Water: density 998.2 kg/m3, dynamic viscosity 1.002e-3 Pa s; g = 9.80665 m/s2. Pipe
  diameters are inner diameters; pipe friction is Darcy-Weisbach with the Colebrook-White
  friction factor (or an equivalent explicit formula). Pressures are gauge pressures, 1 bar =
  100 kPa. The pressure at a node is rho g times the difference between its piezometric head
  and its elevation; velocity heads are neglected, as in EPANET.

  Find the highest and the lowest header pressure during the day, the lowest gauge pressure at
  N9 during the day, the highest total station flow and the depth of water in the reservoir at
  24 h.
answers:
  - key: max_header_pressure
    description: Highest header pressure during the 24 h
    unit: bar
    rel_tol: 0.03
  - key: min_header_pressure
    description: Lowest header pressure during the 24 h
    unit: bar
    rel_tol: 0.03
  - key: min_pressure_n9
    description: Lowest gauge pressure at node N9 during the 24 h
    unit: bar
    rel_tol: 0.03
  - key: max_station_flow
    description: Highest total flow of the three pumps during the 24 h
    unit: m3/h
    rel_tol: 0.03
  - key: reservoir_level_24h
    description: Water depth in the clear-water reservoir at 24 h (it sets the delivered volume)
    unit: m
    abs_tol: 0.1
