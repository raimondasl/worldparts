id: scale-plant-transfer-01
title: Three pumped stages from river to tower over one day
level: 4
category: transient
domain: distribution
prompt: |
  A water system moves water in three pumped stages over one day, 0 h to 24 h. Intake
  pumps lift river water into a settling tank; three treatment trains pump settled water
  through filters and UV reactors into a clearwell; a high-lift station pumps from the
  clearwell up to a water tower that supplies a looped town network.

  Elevations are relative to the settling-tank floor (the datum). Every tank is an open
  vertical cylinder fed through its bottom inlet and drained through its bottom outlet;
  tank connections add no loss.

  | Tank | Floor elevation (m) | Inner diameter (m) | Height (m) | Depth at 0 h (m) |
  |---|---:|---:|---:|---:|
  | Settling tank | 0 | 20 | 5.0 | 3.0 |
  | Clearwell | 5.0 | 24 | 6.0 | 3.5 |
  | Tower | 45.0 | 12 | 6.0 | 3.0 |

  Stage 1 (intake). An intake pipe runs from the river end, held at 0.2 bar gauge at
  elevation -12.0 m, to the intake header. Two identical pumps, I1 and I2, run in parallel
  from the header, each through its own non-return valve (Kv 500 m3/h) into the raw main to
  the settling tank. The header, pumps and valves are at -12.0 m.

  Stage 2 (treatment). The settling tank's outlet feeds a suction main to header S. Three
  trains, A, B and C, run from S to a collector header C, each in flow order: a branch pipe,
  a pump, a non-return valve (Kv 300 m3/h), a media filter (clean pressure drop 0.25 bar at
  100 m3/h: 70 % a media loss proportional to the flow, 30 % a housing loss proportional to
  the flow squared; all filters clean), a UV reactor (0.12 bar at 100 m3/h, proportional to
  the flow squared) and a fully open valve (Kv 250 m3/h). S, C and the trains are at the
  datum. A collector main runs from C to the clearwell.

  Stage 3 (high-lift). The clearwell's outlet feeds a suction pipe to the station header at
  elevation 5.0 m. Two identical pumps, L1 and L2, run in parallel from it, each through its
  own non-return valve (Kv 600 m3/h) into the rising main to the tower. Pipe T1 leaves the
  tower's outlet for the town. Non-return valves block reverse flow.

  | Pipe | From | To | Length (m) | Inner diameter (mm) | Rise (m) | K |
  |---|---|---|---:|---:|---:|---:|
  | Intake | river end | intake header | 40 | 300 | 0 | 1.5 |
  | Raw main | I1, I2 valves | settling tank | 600 | 300 | 12.0 | 4.0 |
  | Suction main | settling tank | S | 25 | 300 | 0 | 1.0 |
  | Branch A, B, C (each) | S | pump of its train | 12 | 150 | 0 | 1.5 |
  | Collector main | C | clearwell | 120 | 300 | 5.0 | 3.0 |
  | Station suction | clearwell | station header | 20 | 300 | 0 | 0.5 |
  | Rising main | L1, L2 valves | tower | 2500 | 250 | 40.0 | 5.0 |

  K includes any exit loss into a tank. Pumps at rated speed (every curve an exact
  quadratic through its points):

  | Pumps | Head at 0 / 100 / 200 / 300 m3/h (m) |
  |---|---|
  | I1, I2 | 32.0 / 29.5 / 22.0 / 9.5 |
  | L1, L2 | 72.0 / 70.0 / 64.0 / 54.0 |

  | Pumps | Head at 0 / 40 / 80 / 120 m3/h (m) |
  |---|---|
  | A, B, C | 24.0 / 22.08 / 16.32 / 6.72 |

  A running pump runs at rated speed; a stopped pump passes no flow.

  Town network:

  | Pipe | From | To | Length (m) | Inner diameter (mm) |
  |---|---|---|---:|---:|
  | T1 | tower outlet | J1 | 600 | 300 |
  | P12 | J1 | J2 | 500 | 200 |
  | P23 | J2 | J3 | 400 | 150 |
  | P34 | J3 | J4 | 500 | 150 |
  | P41 | J4 | J1 | 400 | 200 |
  | P25 | J2 | J5 | 300 | 100 |
  | P46 | J4 | J6 | 350 | 100 |

  | Node | J1 | J2 | J3 | J4 | J5 | J6 |
  |---|---:|---:|---:|---:|---:|---:|
  | Elevation (m) | 5.0 | 3.0 | 9.0 | 6.0 | 1.0 | 4.0 |
  | Outlet orifice diameter (mm) | none | 34 | 28 | 34 | 32 | 28 |

  The town pipes have no minor losses. The town's demand is
  pressure-driven: the consumers at each of J2 to J6 act as one sharp-edged orifice
  discharging to atmosphere at the node's elevation, passing Q = 0.62 x A x f x sqrt(2 p /
  rho), with A the orifice area from the diameter in the table, p the node's gauge pressure
  and f the open fraction of every orifice, which follows this schedule (each value holds
  from its From hour, inclusive, up to its To hour):

  | From (h) | To (h) | Open fraction |
  |---:|---:|---:|
  | 0 | 6 | 0.35 |
  | 6 | 9 | 0.85 |
  | 9 | 12 | 1.00 |
  | 12 | 18 | 0.70 |
  | 18 | 22 | 0.95 |
  | 22 | 24 | 0.50 |

  Controls. Each pump has a level switch: it starts when the depth of its tank is below its
  start depth and stops when the depth is above its stop depth; in between it keeps its
  state.

  | Pump | Tank measured | Start below (m) | Stop above (m) | State at 0 h |
  |---|---|---:|---:|---|
  | I1 | settling tank | 2.0 | 4.0 | running |
  | I2 | settling tank | 1.2 | 3.5 | stopped |
  | A | clearwell | 3.5 | 5.2 | running |
  | B | clearwell | 3.0 | 4.8 | running |
  | C | clearwell | 2.5 | 4.6 | stopped |
  | L1 | tower | 2.0 | 5.0 | running |
  | L2 | tower | 1.0 | 4.0 | stopped |

  Simulation. Quasi-steady, with a fixed time step of 60 s. At each step time t: apply the
  schedule for t, solve the network with the current depths and pump states, check every
  switch against the depths at t (switches take effect at t and the network is solved
  again), then advance all three depths to t + 60 s with that solution's flows (explicit
  Euler). The flows found at t hold for the step that follows.

  Conventions: water density 998.2 kg/m3, dynamic viscosity 1.002e-3 Pa s, g = 9.80665
  m/s2. Pipes follow Darcy-Weisbach with the Colebrook friction factor (or an equivalent
  explicit formula); a pipe's minor-loss coefficient K acts on its own velocity head. A Kv
  element passes Q (m3/h) with a pressure drop of 0.9982 (Q/Kv)^2 bar. Velocity heads at
  junctions are neglected (as in EPANET), so a node pressure is the static pressure there.
  Pressures are gauge. All pipes have a roughness of 0.1 mm; the rise of each town pipe follows
  from the tower floor and node elevations.

  Find the flow of pump I1 at 0 h. Over the day, find the total volume pumped by each
  stage (into the settling tank, into the clearwell and into the tower) and the lowest
  clearwell depth.
answers:
  - key: flow_intake_start
    description: Flow of intake pump I1 at 0 h
    unit: "m3/h"
    rel_tol: 0.03
  - key: intake_volume
    description: Total volume pumped into the settling tank over the day
    unit: "m3"
    rel_tol: 0.05
  - key: treated_volume
    description: Total volume pumped into the clearwell over the day
    unit: "m3"
    rel_tol: 0.05
  - key: distributed_volume
    description: Total volume pumped into the tower over the day
    unit: "m3"
    rel_tol: 0.05
  - key: min_clearwell_level
    description: Lowest clearwell water depth over the day
    unit: "m"
    rel_tol: 0.05
