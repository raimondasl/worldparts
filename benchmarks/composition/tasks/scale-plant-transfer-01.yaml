notes: |
  Scale task (48 components, seven level switches, 24 h with a demand schedule). Every
  pump curve is an exact quadratic (intake 32 - 0.00025 Q^2, trains 24 - 0.0012 Q^2,
  high-lift 72 - 0.0002 Q^2). The lag units (I2, train C, L2) never start: I1 alone (about
  240 m3/h) refills the settling tank, trains A and B (about 97 m3/h each) keep up with the
  clearwell, and L1 alone keeps the tower above 1.98 m. Switching in the reference run: I1
  is off from 5.5 h to 11.6 h; train B is off from 4.8 h to 11.2 h; L1 stops at 1.5 h, starts
  at 5.4 h, stops at 13.0 h, starts at 15.0 h and stops at 22.3 h. The lowest clearwell
  depth, 2.81 m at 13.0 h, comes after L1 (about 241 m3/h) has drawn the clearwell below
  train B's 3.0 m start depth while A and B together deliver only about 194 m3/h. It is set
  by when L1 stops, not by a threshold. The highest clearwell depth, 4.92 m at 5.4 h (not an
  answer), stays 0.28 m below train A's 5.2 m stop depth, so no model variant stops train A
  (every independent variant peaked at 4.91 to 4.94 m). Balances from the reference run (m3): intake 4340.6
  = treated 4088.3 + settling rise 314.16 m2 x 0.803 m = 252.3; treated 4088.3 =
  distributed 4011.0 + clearwell rise 452.39 m2 x 0.171 m = 77.3; distributed 4011.0 =
  delivered 3997.3 + tower rise 113.10 m2 x 0.121 m = 13.7.

  Independent checks without worldparts. Answers in order: I1 flow at 0 h (m3/h); intake,
  treated and distributed volume (m3); lowest clearwell depth (m):
  - reference (worldparts, Churchill, 60 s): 242.28; 4340.6, 4088.3, 4011.0; 2.807.
  - own Python (scipy.optimize.root, explicit Euler, switches as stated), Colebrook, 60 s:
    242.38; 4342.6, 4090.6, 4009.1; 2.806.
  - own Python, Swamee-Jain, 60 s: 242.32; 4341.4, 4088.7, 4011.3; 2.807.
  - own Python, Colebrook, 15 s: 242.38; 4351.0, 4095.8, 4003.1; 2.813.
  - own Python, Colebrook, 300 s: 242.38; 4313.3, 4076.3, 4042.0; 2.795.
  - WNTR 1.5.0 EpanetSimulator (EPANET 2.2, hydraulic and report step 60 s; pumps as
    three-point curves; clean filters as GPVs with a head-loss curve from the
    linear-plus-quadratic law; UV reactors and valves as TCVs; non-return valves as CV
    pipes; orifices as TCVs into reservoirs with time controls; EPANET level controls;
    totals as rectangle sums over the 60 s report): 242.33; 4349.0, 4095.5, 4005.7; 2.814.
  Largest difference 0.8 % (300 s step), 0.3 % at 60 s. Timing: load 0.02 s, solve 76 ms,
  simulate 6.1 s (MCP load_system 0.05 s, simulate 11.4 s).
