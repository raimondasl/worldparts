id: scale-plant-steady-01
title: Three-train treatment plant operating point
level: 4
category: operating_point
domain: treatment
prompt: |
  A water treatment plant has three parallel treatment trains, A, B and C, between an open
  raw-water tank and an open clearwell. Raw water leaves the bottom outlet of the raw-water
  tank through a suction main to a suction header S. From S each train runs, in flow order:
  a branch pipe, a centrifugal pump, a non-return valve, a pressure media filter, a UV
  reactor and an outlet valve, which discharges into a collector header C. From C a
  collector main rises to the bottom inlet of the clearwell.

  The raw-tank floor, S, C and all train equipment are at one elevation, the datum; the
  clearwell floor is 5.0 m above it. The raw-water tank holds 3.0 m of water and the
  clearwell 2.8 m; treat both depths as constant (this is a steady operating point). Tank
  connections add no loss beyond the pipes' K values.

  | Pipe | From | To | Length (m) | Inner diameter (mm) | Rise (m) | K |
  |---|---|---|---:|---:|---:|---:|
  | Suction main | raw-tank outlet | S | 25 | 300 | 0 | 1.0 |
  | Branch A, B, C (each) | S | pump of its train | 12 | 150 | 0 | 1.5 |
  | Collector main | C | clearwell inlet | 120 | 300 | 5.0 | 3.0 |

  All pipes have an absolute roughness of 0.1 mm. The collector main's K includes the exit
  loss into the clearwell. Every pump runs at rated speed. The equipment is the same in
  every train:

  | Item | Data |
  |---|---|
  | Pump | head 24.0 m at 0 m3/h, 22.08 m at 40 m3/h, 16.32 m at 80 m3/h and 6.72 m at 120 m3/h at rated speed (an exact quadratic) |
  | Non-return valve | Kv 300 m3/h for forward flow; it blocks reverse flow |
  | Media filter | clean pressure drop 0.25 bar at 100 m3/h: 70 % of it is a media loss proportional to the flow, 30 % a housing loss proportional to the flow squared |
  | UV reactor | pressure drop 0.12 bar at 100 m3/h, proportional to the flow squared; irradiated volume 60 L; average fluence rate 25 mW/cm2 at full lamp output |
  | Outlet valve | Kv 250 m3/h, fully open unless stated |

  The trains differ in three ways. Train A: its UV lamp delivers only 80 % of the nominal
  fluence rate. Train B: its filter bed is partly loaded, so its media loss (the part
  proportional to the flow) is 1.8 times the clean value at any flow; its housing loss is
  unchanged. Train C: its outlet valve is partly closed, with an effective Kv of 70 m3/h.

  Conventions: water density 998.2 kg/m3, dynamic viscosity 1.002e-3 Pa s, g = 9.80665
  m/s2. Pipes follow Darcy-Weisbach with the Colebrook friction factor (or an equivalent
  explicit formula); a pipe's minor-loss coefficient K acts on its own velocity head. A Kv
  element passes Q (m3/h) with a pressure drop of 0.9982 (Q/Kv)^2 bar. Velocity heads at
  junctions are neglected (as in EPANET), so a node pressure is the static pressure there.
  Pressures are gauge. The UV dose is the fluence rate actually delivered times the irradiated
  volume divided by the flow (mW/cm2 x s = mJ/cm2).

  Find the flow through each train, the UV dose in each train, the total flow into the
  clearwell and the gauge pressure in the collector header C.
answers:
  - key: flow_a
    description: Flow through train A
    unit: "m3/h"
    rel_tol: 0.03
  - key: flow_b
    description: Flow through train B
    unit: "m3/h"
    rel_tol: 0.03
  - key: flow_c
    description: Flow through train C
    unit: "m3/h"
    rel_tol: 0.03
  - key: dose_a
    description: UV dose in train A
    unit: "mJ/cm2"
    rel_tol: 0.03
  - key: dose_b
    description: UV dose in train B
    unit: "mJ/cm2"
    rel_tol: 0.03
  - key: dose_c
    description: UV dose in train C
    unit: "mJ/cm2"
    rel_tol: 0.03
  - key: total_flow
    description: Total flow into the clearwell
    unit: "m3/h"
    rel_tol: 0.03
  - key: header_pressure
    description: Gauge pressure in the collector header C
    unit: "bar"
    rel_tol: 0.03
