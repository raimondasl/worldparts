    connections:
      - [raw.outlet, suction.port_a]
      - [suction.port_b, branch_a.port_a]
      - [branch_a.port_b, pump_a.inlet]
      - [pump_a.outlet, nrv_a.port_a]
      - [nrv_a.port_b, filter_a.inlet]
      - [filter_a.outlet, uv_a.inlet]
      - [uv_a.outlet, valve_a.port_a]
      - [valve_a.port_b, collector.port_a]
      - [suction.port_b, branch_b.port_a]
      - [branch_b.port_b, pump_b.inlet]
      - [pump_b.outlet, nrv_b.port_a]
      - [nrv_b.port_b, filter_b.inlet]
      - [filter_b.outlet, uv_b.inlet]
      - [uv_b.outlet, valve_b.port_a]
      - [valve_b.port_b, collector.port_a]
      - [suction.port_b, branch_c.port_a]
      - [branch_c.port_b, pump_c.inlet]
      - [pump_c.outlet, nrv_c.port_a]
      - [nrv_c.port_b, filter_c.inlet]
      - [filter_c.outlet, uv_c.inlet]
      - [uv_c.outlet, valve_c.port_a]
      - [valve_c.port_b, collector.port_a]
      - [collector.port_b, clearwell.inlet]
  steps:
    - {op: solve, read: {flow_a: pump_a.volume_flow, flow_b: pump_b.volume_flow, flow_c: pump_c.volume_flow, dose_a: uv_a.dose, dose_b: uv_b.dose, dose_c: uv_c.dose, total_flow: collector.volume_flow, header_pressure: collector.port_a.p}}
  expected: {flow_a: 98.87333504, flow_b: 94.99294162, flow_c: 68.99606239, dose_a: 43.69226544, dose_b: 56.84632887, dose_c: 78.26533591, total_flow: 262.8623391, header_pressure: 0.8162632326}
notes: |
  Scale task (22 components). Every pump curve is an exact quadratic, H = 24 - 0.0012 Q^2,
  so curve-fitting choices cannot move the answer. Hand check of the result: the collector
  header C is at 8.34 m of head (0.816 bar gauge): the clearwell head 5.0 + 2.8 = 7.8 m plus
  0.54 m in the collector main at 262.9 m3/h. Train C at 69.0 m3/h: pump head 18.29 m; its
  valve alone takes (69.0/70)^2 x 0.9982 = 0.970 bar = 9.9 m. Doses: 25 x 0.8 x 0.060 /
  (98.87/3600) = 43.7, 25 x 0.060 / (94.99/3600) = 56.8 and 25 x 0.060 / (69.00/3600) =
  78.3 mJ/cm2.

  Independent checks without worldparts (answers in this order: flows A, B, C in m3/h;
  doses A, B, C in mJ/cm2; total in m3/h; header pressure in bar):
  - reference (worldparts, Churchill friction): 98.87, 94.99, 69.00; 43.69, 56.85, 78.27;
    262.86; 0.8163.
  - own Python (scipy.optimize.root on node heads and link flows, Colebrook friction):
    98.89, 95.01, 69.01; 43.68, 56.84, 78.25; 262.91; 0.8161.
  - the same with Swamee-Jain friction: 98.88, 95.00, 69.00; 43.69, 56.84, 78.26; 262.88;
    0.8163.
  - WNTR 1.5.0 EpanetSimulator (EPANET 2.2, D-W with Swamee-Jain; pumps as exact three-point
    curves, non-return valves as CV pipes with the Kv loss, UV reactors and valves as TCVs,
    filters as GPVs with a head-loss curve from the linear-plus-quadratic law, the tanks as
    fixed-head reservoirs): 98.88, 95.00, 69.00; 43.69, 56.84, 78.26; 262.89; 0.8162.
  Largest difference 0.02 %, so 3 % leaves room for other friction formulas and small
  conversion errors. Timing: load 0.07 s, solve 16 ms (MCP load_system 0.03 s, solve
  0.03 s).
