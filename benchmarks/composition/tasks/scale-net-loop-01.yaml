notes: |
  Outline: the west reservoir (72 m) supplies 176.9 m3/h and the east reservoir (66 m) 76.6
  m3/h of the 253.5 m3/h drawn by the 12 outlets. Pressures range from 3.19 bar at J14 (the
  high north-east corner, 30 m, far from both mains) to 4.41 bar at J41 (the low south-west
  corner, 17 m). The loops carry flow both ways: from J44 the east supply reaches J14 along
  the east column and J41 along the south row, and J33 and J32 inside the grid; the west
  supply feeds the rest. Pipe J11-J21 carries 99.9 m3/h south. Velocities stay below 0.9 m/s.

  Independent check without worldparts: WNTR 1.5.0 EpanetSimulator (EPANET 2.2) built from the
  prompt tables: reservoirs at fixed heads of 72.0 and 66.0 m, Darcy-Weisbach headloss
  (Swamee-Jain), relative viscosity 0.9823 (1.0038e-6 m2/s), accuracy 1e-7, the two mains with
  a minor-loss coefficient of 2.0, every outlet an emitter of coefficient 0.6 A sqrt(2 g)
  (exponent 0.5). EPANET against the reference: west 176.92 against 176.89 m3/h (+0.02 %),
  east 76.56 against 76.58 m3/h (-0.02 %), J14 3.193 against 3.192 bar (+0.02 %), J41 4.406
  against 4.406 bar (+0.01 %), J11-J21 99.91 against 99.90 m3/h (+0.02 %). All within 0.03 %,
  against tolerances of 3 %.

  Reference timing (worldparts, warm catalogue): load 0.016 s, steady solve 0.007 s for the 40
  components (26 pipes, 12 outlets, 2 supplies).
