id: scale-net-loop-01
title: Looped grid fed by two reservoirs at different levels
level: 4
category: operating_point
domain: distribution
prompt: |
  A looped distribution zone is fed by gravity from two service reservoirs whose water levels
  stay constant: the west reservoir at elevation 72.0 m and the east reservoir at 66.0 m (all
  elevations above one datum). The west reservoir feeds junction J11 through a transmission
  main 1800 m long with inner diameter 250 mm; the east reservoir feeds junction J44 through a
  main 1200 m long with inner diameter 200 mm. Each main has K = 2.0 in total (entry and
  fittings). The 16 junctions form a 4 x 4 grid, Jrc with row r = 1 (north) to 4 and column c
  = 1 (west) to 4:

  | Junction | Elevation (m) | Outlet orifice diameter (mm) |
  |---|---:|---:|
  | J11 | 22.0 | none |
  | J12 | 24.0 | 22 |
  | J13 | 27.0 | 20 |
  | J14 | 30.0 | 18 |
  | J21 | 20.0 | 22 |
  | J22 | 23.0 | 24 |
  | J23 | 26.0 | none |
  | J24 | 28.0 | 20 |
  | J31 | 18.0 | 20 |
  | J32 | 21.0 | 24 |
  | J33 | 25.0 | 22 |
  | J34 | 27.0 | 18 |
  | J41 | 17.0 | 20 |
  | J42 | 19.0 | 22 |
  | J43 | 23.0 | none |
  | J44 | 26.0 | none |

  Grid pipes (no minor losses):

  | Pipe | From | To | Length (m) | Inner diameter (mm) |
  |---|---|---|---:|---:|
  | J11-J12 | J11 | J12 | 400 | 200 |
  | J12-J13 | J12 | J13 | 450 | 150 |
  | J13-J14 | J13 | J14 | 400 | 100 |
  | J21-J22 | J21 | J22 | 420 | 150 |
  | J22-J23 | J22 | J23 | 380 | 150 |
  | J23-J24 | J23 | J24 | 400 | 100 |
  | J31-J32 | J31 | J32 | 400 | 150 |
  | J32-J33 | J32 | J33 | 430 | 100 |
  | J33-J34 | J33 | J34 | 380 | 150 |
  | J41-J42 | J41 | J42 | 450 | 100 |
  | J42-J43 | J42 | J43 | 400 | 150 |
  | J43-J44 | J43 | J44 | 420 | 200 |
  | J11-J21 | J11 | J21 | 350 | 200 |
  | J21-J31 | J21 | J31 | 360 | 150 |
  | J31-J41 | J31 | J41 | 340 | 100 |
  | J12-J22 | J12 | J22 | 350 | 100 |
  | J22-J32 | J22 | J32 | 360 | 150 |
  | J32-J42 | J32 | J42 | 340 | 100 |
  | J13-J23 | J13 | J23 | 350 | 150 |
  | J23-J33 | J23 | J33 | 360 | 100 |
  | J33-J43 | J33 | J43 | 340 | 150 |
  | J14-J24 | J14 | J24 | 350 | 100 |
  | J24-J34 | J24 | J34 | 360 | 150 |
  | J34-J44 | J34 | J44 | 340 | 200 |

  Every pipe, the two mains included, has a roughness of 0.1 mm. Demand is pressure-driven:
  the customers at each junction with an outlet act as one orifice discharging to atmosphere
  at the junction's elevation, Q = 0.6 x A x sqrt(2 p / rho), with A = pi d^2 / 4 from the
  diameter in the table and p the junction's gauge pressure. Junctions marked none draw
  nothing.

  Water: density 998.2 kg/m3, dynamic viscosity 1.002e-3 Pa s; g = 9.80665 m/s2. Pipe
  diameters are inner diameters; pipe friction is Darcy-Weisbach with the Colebrook-White
  friction factor (or an equivalent explicit formula). Pressures are gauge pressures, 1 bar =
  100 kPa. The pressure at a node is rho g times the difference between its piezometric head
  and its elevation; velocity heads are neglected, as in EPANET.

  Find the steady flow supplied by each reservoir, the gauge pressures at J14 and J41, and the
  flow in pipe J11-J21 (from J11 towards J21).
answers:
  - key: west_supply_flow
    description: Flow supplied by the west reservoir
    unit: m3/h
    rel_tol: 0.03
  - key: east_supply_flow
    description: Flow supplied by the east reservoir
    unit: m3/h
    rel_tol: 0.03
  - key: pressure_j14
    description: Gauge pressure at junction J14
    unit: bar
    rel_tol: 0.03
  - key: pressure_j41
    description: Gauge pressure at junction J41
    unit: bar
    rel_tol: 0.03
  - key: flow_j11_j21
    description: Flow in pipe J11-J21 from J11 towards J21
    unit: m3/h
    rel_tol: 0.03
