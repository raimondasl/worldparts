id: pump-series-01
title: In-line booster speed for a two-stage hill supply
level: 2
category: sizing
domain: pumping
prompt: |
  A hill village is supplied from a valley reservoir in two stages. The duty pump draws
  from the bottom outlet of an open reservoir tank (water 3.0 m deep, nozzle Kv 400
  m3/h; pump at the level of the tank bottom) and feeds main 1: 900 m, inner diameter
  152 mm, absolute roughness 0.1 mm, rising 21 m, K = 6. At its end an in-line booster
  pump (variable speed, rated 2900 rpm) feeds main 2: 1400 m of the same pipe, rising a
  further 38 m to a free discharge, K = 10 including the exit.

  Duty pump, fixed at rated speed: head 40 m at 0 m3/h, 38 m at 20 m3/h, 32 m at 40
  m3/h, 22 m at 60 m3/h. Booster at rated speed: head 48 m at 0 m3/h, 46 m at 20 m3/h,
  40 m at 40 m3/h, 30 m at 60 m3/h; shaft power 3.4, 5.1, 6.6 and 7.9 kW at the same
  flows. Fit quadratics through each set of points; the booster follows the affinity
  laws (flow ~ n, head ~ n^2, power ~ n^3).

  Water: density 998.2 kg/m3, viscosity 1.002e-3 Pa s; g = 9.80665 m/s2. Pipes:
  Darcy-Weisbach. A Kv element drops (Q/Kv)^2 x 0.9982 bar (Q in m3/h).

  The village needs 45 m3/h. At what speed must the booster run, what is the gauge
  pressure at its inlet, and what is its shaft power?
answers:
  - key: booster_speed
    description: Booster speed that delivers 45 m3/h
    unit: rpm
    rel_tol: 0.03
  - key: booster_inlet_pressure
    description: Gauge pressure at the booster inlet
    unit: bar
    rel_tol: 0.03
  - key: booster_power
    description: Booster shaft power
    unit: kW
    rel_tol: 0.03
reference:
  system:
    worldparts_system: "0.1"
    name: two-stage hill supply
    components:
      - name: reservoir
        type: tank
        parameters: {diameter: 8.0, height: 4.0, initial_level: 3.0, initial_temperature: 15, port_kv: 400}
      - name: duty
        type: centrifugal_pump
        parameters:
          head_curve: [[0, 40], [20, 38], [40, 32], [60, 22]]
          power_curve: [[0, 3.0], [20, 4.4], [40, 5.6], [60, 6.6]]
          npsh_curve: [[20, 2.0], [40, 2.8], [60, 4.4]]
          motor_power: 7.5
      - name: main1
        type: pipe
        parameters: {length: 900, diameter: 152, roughness: 0.1, height_difference: 21, minor_loss: 6}
      - name: booster
        type: centrifugal_pump
        parameters:
          head_curve: [[0, 48], [20, 46], [40, 40], [60, 30]]
          power_curve: [[0, 3.4], [20, 5.1], [40, 6.6], [60, 7.9]]
          npsh_curve: [[20, 2.2], [40, 3.0], [60, 4.6]]
          motor_power: 11
      - name: main2
        type: pipe
        parameters: {length: 1400, diameter: 152, roughness: 0.1, height_difference: 38, minor_loss: 10}
      - name: village
        type: drain
    connections:
      - [reservoir.outlet, duty.inlet]
      - [duty.outlet, main1.port_a]
      - [main1.port_b, booster.inlet]
      - [booster.outlet, main2.port_a]
      - [main2.port_b, village.port]
  steps:
    - op: solve_for
      target: duty.volume_flow
      value: 45 m3/h
      vary: booster.speed
      lower: 0.5
      upper: 1.2
      read: {booster_speed: booster.speed_rpm, booster_inlet_pressure: booster.inlet.p, booster_power: booster.shaft_power}
  expected: {booster_speed: 2790.608385, booster_inlet_pressure: 0.8413577888, booster_power: 6.292641296}
notes: |
  Both head curves have exactly H = a - 0.005 Q^2 (a = 40 and 48); booster power is exactly
  3.4 + 0.09 Q - 0.00025 Q^2. At 45 m3/h: v = 0.689 m/s, Re = 1.04e5, f = 0.0203. Booster
  inlet head = 3.0 m (tank) - 0.13 m (nozzle) + 29.88 m (duty pump) - 21 m - 3.13 m (main 1:
  (f L/D + 6) v^2/2g) = 8.61 m = 0.843 bar. Booster head needed = 38 m + 4.89 m (main 2) -
  8.61 m = 34.27 m; 48 s^2 - 0.005 x 2025 = 34.27 gives s = 0.962, 2789 rpm; power
  3.4 s^3 + 4.05 s^2 - 0.506 s = 6.28 kW. Independent Python check: 2789 rpm, 0.843 bar,
  6.284 kW, within 0.2 % of the reference.
