notes: |
  Outline: the pump curve is exactly H = 70 - Q^2/200. With all 22 sprinklers open the pump
  delivers 59.9 m3/h at 52.1 m, so M0 is at 5.28 bar (2 m of suction head less a small suction
  loss). Zone flows: A 11.0, B 15.0, C 9.8, D 13.3, E 10.7 m3/h (their sum is the pump flow);
  mainline velocities 0.6 to 1.4 m/s. Zone E hangs off the highest main node (M5, 16 m) behind
  the smallest main (80 mm) and its lateral climbs to 20 m, so its last sprinkler, E4, has the
  lowest pressure, 1.79 bar. The lowest sprinkler of any other zone is D5 at 2.56 bar, 43 %
  higher, so the zone answer is clear-cut.

  Independent check without worldparts: WNTR 1.5.0 EpanetSimulator (EPANET 2.2) built from the
  prompt tables: Darcy-Weisbach headloss (EPANET's Swamee-Jain friction factor), relative
  viscosity 0.9823 (1.0038e-6 m2/s), accuracy 1e-7; the reservoir a fixed head of 2.0 m; every
  sprinkler an emitter of coefficient 0.95 A sqrt(2 g) (exponent 0.5); every zone valve a TCV
  whose loss coefficient reproduces 0.9982 (Q/Kv)^2 bar; the pump a three-point curve through
  (0, 70), (60, 52) and (90, 29.5). EPANET against the reference: pump flow 59.88 against
  59.88 m3/h (+0.01 %), M0 5.278 against 5.278 bar (-0.005 %), zone E 10.71 against 10.71 m3/h
  (+0.02 %), lowest sprinkler 1.790 against 1.789 bar (+0.05 %), at E4 in zone E. All within
  0.05 %, against tolerances of 3 %.

  Reference timing (worldparts, warm catalogue): load 0.02 s, steady solve 0.015 s for the 57
  components.
