id: scale-net-irrigation-01
title: Five-zone campus irrigation network, all zones running
level: 4
category: operating_point
domain: distribution
prompt: |
  A campus irrigation system runs all five of its zones at the same time. Find its steady
  operating point.

  Supply. One pump lifts water from a reservoir whose water surface stays 2.0 m above the
  pump. The pump, its suction node S and its discharge node M0 are at elevation 0.0 m. The
  suction pipe from the reservoir to S is 15 m long with inner diameter 150 mm, roughness 0.05
  mm and K = 1.5 in total (entry and fittings). Pump head at its fixed speed: 70 m at 0 m3/h,
  65.5 m at 30 m3/h, 52 m at 60 m3/h and 29.5 m at 90 m3/h (the points lie exactly on H = 70 -
  Q^2/200, Q in m3/h).

  Mainline. From M0 the mainline runs uphill through M1 to M5 (roughness 0.05 mm, no minor
  losses):

  | Pipe | From | To | Length (m) | Inner diameter (mm) | Elevation of To (m) |
  |---|---|---|---:|---:|---:|
  | main 1 | M0 | M1 | 150 | 125 | 3.0 |
  | main 2 | M1 | M2 | 120 | 125 | 6.0 |
  | main 3 | M2 | M3 | 140 | 100 | 9.0 |
  | main 4 | M3 | M4 | 110 | 100 | 12.0 |
  | main 5 | M4 | M5 | 160 | 80 | 16.0 |

  Zones. Each zone is fed from one mainline node through a fully open zone valve that leads to
  the zone's head node, at the same elevation as its feed node. A valve acts as a Kv element:
  its pressure drop is 0.9982 x (Q/Kv)^2 bar with Q in m3/h. From the head node a lateral
  (roughness 0.02 mm, no minor losses) runs through the zone's sprinkler nodes in series, and
  every sprinkler node carries one sprinkler.

  | Zone | Feed node | Head node | Valve Kv (m3/h) | Lateral inner diameter (mm) | Nozzle diameter (mm) | Sprinkler nodes |
  |---|---|---|---:|---:|---:|---|
  | A | M1 | A0 | 20 | 40 | 6.0 | A1 to A4 |
  | B | M2 | B0 | 25 | 50 | 6.5 | B1 to B5 |
  | C | M3 | C0 | 20 | 40 | 6.0 | C1 to C4 |
  | D | M4 | D0 | 25 | 50 | 6.5 | D1 to D5 |
  | E | M5 | E0 | 25 | 40 | 7.0 | E1 to E4 |

  Lateral segments:

  | Segment | From | To | Length (m) | Elevation of To (m) |
  |---|---|---|---:|---:|
  | A1 | A0 | A1 | 20 | 2.5 |
  | A2 | A1 | A2 | 30 | 2.0 |
  | A3 | A2 | A3 | 30 | 1.5 |
  | A4 | A3 | A4 | 30 | 1.0 |
  | B1 | B0 | B1 | 20 | 6.5 |
  | B2 | B1 | B2 | 30 | 7.0 |
  | B3 | B2 | B3 | 30 | 7.0 |
  | B4 | B3 | B4 | 30 | 7.5 |
  | B5 | B4 | B5 | 30 | 8.0 |
  | C1 | C0 | C1 | 20 | 9.0 |
  | C2 | C1 | C2 | 30 | 8.5 |
  | C3 | C2 | C3 | 30 | 8.0 |
  | C4 | C3 | C4 | 30 | 8.0 |
  | D1 | D0 | D1 | 20 | 12.5 |
  | D2 | D1 | D2 | 30 | 13.0 |
  | D3 | D2 | D3 | 30 | 13.5 |
  | D4 | D3 | D4 | 30 | 14.0 |
  | D5 | D4 | D5 | 30 | 14.5 |
  | E1 | E0 | E1 | 20 | 17.0 |
  | E2 | E1 | E2 | 30 | 18.0 |
  | E3 | E2 | E3 | 30 | 19.0 |
  | E4 | E3 | E4 | 30 | 20.0 |

  Sprinklers. Each sprinkler discharges to atmosphere as an orifice with its zone's nozzle
  diameter d and a discharge coefficient of 0.95: Q = 0.95 x A x sqrt(2 p / rho), with A = pi
  d^2 / 4 and p the gauge pressure at its node (a pressure-driven outlet, not a fixed demand).

  Water: density 998.2 kg/m3, dynamic viscosity 1.002e-3 Pa s; g = 9.80665 m/s2. Pipe
  diameters are inner diameters; pipe friction is Darcy-Weisbach with the Colebrook-White
  friction factor (or an equivalent explicit formula). Pressures are gauge pressures, 1 bar =
  100 kPa. The pressure at a node is rho g times the difference between its piezometric head
  and its elevation; velocity heads are neglected, as in EPANET.

  Find the pump flow, the gauge pressure at M0, the flow into zone E, the lowest gauge
  pressure at any sprinkler and the zone in which that sprinkler is.
answers:
  - key: pump_flow
    description: Flow delivered by the pump
    unit: m3/h
    rel_tol: 0.03
  - key: discharge_pressure
    description: Gauge pressure at the pump discharge node M0
    unit: bar
    rel_tol: 0.03
  - key: zone_e_flow
    description: Flow into zone E through its zone valve
    unit: m3/h
    rel_tol: 0.03
  - key: lowest_sprinkler_pressure
    description: Lowest gauge pressure at any sprinkler node
    unit: bar
    rel_tol: 0.03
  - key: lowest_pressure_zone
    description: Zone of the sprinkler with the lowest pressure
    kind: choice
    choices: [zone_a, zone_b, zone_c, zone_d, zone_e]
