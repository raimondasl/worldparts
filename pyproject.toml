[project]
name = "worldparts"
version = "0.1.0"
description = "Agent-ready physical component models: a manifest spec, a tested catalogue of pumps, valves, faucets, pipes and tanks, a lightweight solver, and an MCP server."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Raimondas Lencevicius" }]
requires-python = ">=3.11"
keywords = [
    "ai-agents",
    "mcp",
    "world-model",
    "digital-twin",
    "simulation",
    "hydraulics",
    "water",
    "modelica",
    "fmi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jsonschema>=4.20",
    "mcp>=2.0,<3",
    "numpy>=1.26",
    "pint>=0.23",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
wntr = [
    "wntr>=1.2",
]

[project.scripts]
worldparts = "worldparts.cli:main"

[project.urls]
Homepage = "https://github.com/raimondasl/worldparts"
Issues = "https://github.com/raimondasl/worldparts/issues"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fluids>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "wntr>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
