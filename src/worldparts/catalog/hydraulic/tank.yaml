manifest_version: "0.1"
id: worldparts.hydraulic.tank
version: "0.1.0"
name: Open storage tank
summary: Open atmospheric cylindrical tank with a bottom outlet and a bottom or top inlet, level-dependent static head, overflow at the rim and perfectly mixed temperature.
description: |
  A vertical cylindrical tank of inner `diameter` and `height`, open to the atmosphere, with
  two ports at the bottom (`inlet` and `outlet`; the names are conventional and water may flow
  either way through either port). The pressure at the tank bottom is
  `P_ATM + rho * g * level`, so the tank acts as a pressure boundary whose head changes with
  its level. Each port joins the tank through a Kv resistance (`port_kv`, the nozzle and
  fitting), and when the level falls to 1 mm or below the outflow through both ports is
  blocked (a leakage fraction of 1e-6 of the port Kv remains), so an empty tank does not
  deliver water or report negative levels.

  Top-fed tank: with `inlet_height > 0` the `inlet` port is a pipe that discharges freely
  at that height above the bottom (a rooftop or break tank filled from above, the pipe
  mouth above the water). The inlet's gate then ends at the pipe mouth, whose pressure is
  `P_ATM + rho * g * max(level, inlet_height)`: while the level is below the mouth the
  inflow meets a constant back-pressure and does not depend on the level, and once the
  mouth is submerged the tank behaves exactly as with a bottom inlet. Water cannot flow
  back out through the inlet while the level is below the mouth (the gate is blocked, as
  for an empty tank); with the mouth submerged the inlet can siphon water out, and a
  simulation step draws through it at most the water above the mouth. The `inlet` port
  itself stays at the tank-bottom datum (the pipe runs up inside the tank). With
  `inlet_height = 0` (the default) both ports are at the bottom, as before.

  The `level` and `temperature` are storage states. A steady `solve()` is a snapshot at the
  current level (the states are held); `simulate()` integrates them with explicit Euler at
  the simulation step. The level follows the net volume inflow `A * dlevel/dt = sum(Q_in)`.
  Water that would rise above `height` is spilled over the rim and reported as
  `overflow_rate` (in a simulation, the spill over the step that led to the current sample;
  in a steady solve of a full tank, the net inflow, which is what spills). The temperature
  follows perfect mixing of the inflows with the tank contents; spilled water and outflow
  leave at the tank temperature. An explicit step never takes more water out than the tank
  holds: in a simulation the outflow of each connected port is capped at its share of the
  water above the empty level divided by the step (the gate closes steeply beyond the cap).
  A pump drawing from a nearly empty break tank therefore delivers exactly what flows in,
  with the level settling just above 1 mm, instead of drawing water that is not there; the
  pump then reports the cavitation of a starved suction. The cap binds only when a step
  would nearly empty the tank; for accurate drain-down dynamics still choose a step much
  shorter than the drain time.

  An empty open tank cannot hold its outlet below atmospheric pressure: air would enter.
  The model keeps the suction line full of water, so a pump that holds a discharge column
  (a lift to a rooftop tank) can pull the outlet of an empty tank well below atmospheric
  without cavitating; the `drawing_air` warning flags every such port (empty tank, or a
  simulation step drawing the tank empty, and the port more than 100 Pa below atmospheric).
  The same holds for a top inlet whose mouth is above the water (or, in a simulation, being
  uncovered within one step): it is flagged when its port is more than 100 Pa below
  atmospheric, where a pump or siphon on it pulls on an inlet pipe open to the air. A dry
  top inlet at or above atmospheric pressure is not flagged: a supply too weak to lift water
  to the mouth, a stopped fill pump or a pipe down to a drain passes nothing, which is
  exact. While the mouth is above the water its closed gate still passes a leakage of about
  1e-5 kg/s per bar across it in a simulation (the gate closes with a finite stiffness, as
  for an empty tank): a dry inlet piped to a drain 1 m below the water lets about 1.2 L out
  of a 0.3 m tank in 7 days.

  Not modelled: stratification (the contents are perfectly mixed), heat loss through the wall
  and the free surface, evaporation, the velocity head and vortexing at the outlet nozzle,
  air entrainment when nearly empty (flagged by `drawing_air`, not simulated), the exit
  loss of water entering through a port (the velocity head of the incoming pipe, v**2/(2 g),
  about 0.23 m at 2.1 m/s; add 1 to the feeding pipe's `minor_loss` when it matters; the
  port Kv covers only the nozzle), the pressure drop of the overflow weir (spill is
  instantaneous), non-cylindrical shapes, an outlet above the bottom, the friction of the
  inlet pipe inside the tank, the jet and splash of a free-falling inlet stream and the air
  gap it provides against back-siphonage. Port elevations are the tank bottom; connect pipes
  with `height_difference` to model a tank placed above or below the rest of the network.
tags: [tank, storage, reservoir, level, overflow, mixing, purification]
classification:
  ifc: {entity: IfcTank, predefined_type: STORAGE}
fidelity:
  level: lumped_dynamic
  assumptions:
    - Incompressible water with constant properties (998.2 kg/m3, 1.002e-3 Pa s, 4182 J/(kg K)).
    - Hydrostatic pressure at the bottom ports, P_ATM + rho g level; free surface at atmospheric pressure.
    - A top inlet discharges freely at inlet_height (pressure P_ATM + rho g max(level, inlet_height) at its mouth); backflow through it is blocked while the mouth is above the water.
    - Port connections are quadratic Kv resistances, regularised near zero flow; outflow blocked (leakage 1e-6 of the Kv) at a level of 1 mm or below.
    - In a simulation, outflow over a step is capped at the water above the empty level (above the mouth for a top inlet), shared equally by the connected ports that can draw; a dry port takes no share.
    - Closed gates (empty tank, dry top inlet) pass a small leakage, about 1e-5 kg/s per bar across them in a simulation.
    - Perfectly mixed contents; adiabatic walls and free surface.
    - Explicit Euler integration of level and temperature at the simulation step; instantaneous spill above the rim.
ports:
  - {name: inlet, type: fluid, medium: water, description: "Inlet: a bottom port when inlet_height is 0 (flow may go either way), else a pipe discharging freely at inlet_height (no backflow while its mouth is above the water). Its pressure is referred to the tank bottom."}
  - {name: outlet, type: fluid, medium: water, description: Bottom port (conventionally the outlet; flow may go either way).}
parameters:
  - name: diameter
    description: Inner diameter of the cylindrical tank.
    type: number
    unit: m
    default: 2.0
    minimum: 0.05
    maximum: 100
  - name: height
    description: Height of the rim above the bottom; water above it spills.
    type: number
    unit: m
    default: 3.0
    minimum: 0.1
    maximum: 100
  - name: initial_level
    description: Water level at the start (must not exceed height). Changing it resets the level state; changing any other parameter keeps the current level.
    type: number
    unit: m
    default: 2.0
    minimum: 0
    maximum: 100
  - name: initial_temperature
    description: Water temperature at the start. Changing it resets the temperature state; changing any other parameter keeps the current temperature.
    type: number
    unit: degC
    default: 15
    minimum: 0.5
    maximum: 99
  - name: inlet_height
    description: Height above the bottom at which the inlet pipe discharges (must not exceed height). 0 is a bottom inlet; above 0 the inlet is top-fed and its inflow does not depend on the level while the level is below this height.
    type: number
    unit: m
    default: 0
    minimum: 0
    maximum: 100
  - name: port_kv
    description: Kv of each port connection (nozzle and fitting), m3/h of water at 1 bar.
    type: number
    unit: m3/h
    default: 200
    minimum: 0.01
    maximum: 1000000
states:
  - name: level
    description: Water level above the bottom (reported as the variable `level`); it must not exceed `height`.
    unit: m
    steady: hold
    minimum: 0
    maximum: 100
  - name: temperature
    description: Perfectly mixed water temperature (reported as the variable `temperature`).
    unit: degC
    steady: hold
    minimum: 0.5
    maximum: 99
observables:
  - {name: volume, unit: m3, description: Water volume in the tank (cross-section times level).}
  - {name: fill_fraction, unit: "%", description: Level as a percentage of the height.}
  - {name: net_inflow, unit: m3/h, description: Net volume inflow through both ports (negative when draining).}
  - {name: overflow_rate, unit: m3/h, description: "Volume flow spilled over the rim: in a simulation the spill over the step that led to the current sample; in a steady solve the net inflow of a full, filling tank."}
modes:
  - {name: empty, condition: "level <= 0.001", description: The tank is empty; outflow through the ports is blocked.}
  - {name: overflowing, condition: "overflow_rate > 0", description: The tank is full and water spills over the rim.}
  - {name: filling, condition: "net_inflow > 0.001", description: The level is rising.}
  - {name: draining, condition: "net_inflow < -0.001", description: The level is falling.}
  - {name: steady, condition: "true", description: No significant net flow; the level is constant.}
envelope:
  - code: tank_empty
    severity: warning
    condition: "level <= 0.001"
    message: The tank is empty; outflow is blocked and a pump drawing from it would run dry.
  - code: low_level
    severity: info
    condition: "fill_fraction < 10"
    message: The tank is less than 10 % full.
  - code: tank_overflow
    severity: warning
    condition: "overflow_rate > 0"
    message: The tank is full and spills over the rim.
warnings:
  - {code: drawing_air, severity: warning, description: "A port is dry and under suction: the tank is empty (or, in a simulation, being drawn empty within one step), or a top inlet's mouth is above the water (or being uncovered within one step), and a connected port is more than 100 Pa (about 1 cm of water) below atmospheric pressure. A pump or siphon on it would draw air. The model keeps the line full of water, so results downstream are not physical."}
scenarios:
  - id: drain-through-valve
    description: >-
      Default tank (2 m level) drains through its outlet and a fully open Kv 2.5 valve to
      atmosphere; inlet capped. Hand calculation: the port (Kv 200) and valve in series give
      Kv_eff = 1/sqrt(1/2.5**2 + 1/200**2) = 2.4998047 m3/h; dp = rho g h = 998.2 * 9.80665 * 2
      = 19578.2 Pa, so Q = Kv_eff * sqrt(0.195782 * 1000 / 998.2) = 1.107086 m3/h. The outlet
      pressure is rho g h minus the port drop (Q/200)**2 * 0.9982 bar: 0.1957494 bar.
      Volume pi * 1**2 * 2 = 6.283185 m3.
    system:
      components:
        - {name: dut, type: tank}
        - {name: v, type: valve}
        - {name: sink, type: drain}
      connections:
        - [dut.outlet, v.port_a]
        - [v.port_b, sink.port]
    expect:
      - {variable: dut.net_inflow, value: -1.1070862, rel_tol: 1.0e-5}
      - {variable: dut.outlet.p, value: 0.1957494, abs_tol: 1.0e-6}
      - {variable: dut.volume, value: 6.283185307, rel_tol: 1.0e-9}
      - {variable: dut.fill_fraction, value: 66.666667, rel_tol: 1.0e-7}
      - {variable: dut.level, value: 2.0}
      - {variable: dut.overflow_rate, value: 0.0}
      - {mode: dut, is: draining}
      - {warning: dut.tank_empty, present: false}
      - {warning: dut.tank_overflow, present: false}
  - id: fill-to-overflow
    description: >-
      A 0.5 bar supply fills a 1 m high tank (0.5 m diameter) that starts at 0.99 m through a
      Kv 2.5 valve; outlet capped. The tank is full within about 5 s, after which everything
      that enters spills. Hand calculation at the full level: dp = 50000 - 998.2 * 9.80665 * 1
      = 40210.9 Pa across the valve and port in series (Kv_eff 2.4998047), so
      Q = 2.4998047 * sqrt(0.402109 * 1000 / 998.2) = 1.586608 m3/h, which is both the net
      inflow and the overflow rate.
    system:
      components:
        - {name: src, type: supply, parameters: {pressure: 0.5, temperature: 15}}
        - {name: v, type: valve}
        - {name: dut, type: tank, parameters: {diameter: 0.5, height: 1.0, initial_level: 0.99}}
      connections:
        - [src.port, v.port_a]
        - [v.port_b, dut.inlet]
    simulate: {duration: 60 s, step: 1 s}
    expect:
      - {variable: dut.level, value: 1.0, abs_tol: 1.0e-12}
      - {variable: dut.net_inflow, value: 1.586608, rel_tol: 1.0e-5}
      - {variable: dut.overflow_rate, value: 1.586608, rel_tol: 1.0e-5}
      - {variable: dut.fill_fraction, value: 100, abs_tol: 1.0e-9}
      - {mode: dut, is: overflowing}
      - {warning: dut.tank_overflow, present: true}
  - id: drain-to-empty
    description: >-
      A small tank (0.1 m diameter, 5 cm of water) drains through a Kv 2.5 valve. By the
      analytic drain law sqrt(h) = sqrt(h0) - k sqrt(rho g) t / (2 rho A), with k the series
      mass-flow coefficient 0.0021941 kg/(s Pa^0.5), it empties in about 16 s; after 60 s the
      tank is empty and the tank_empty warning is raised. (A gravity drain has no driving
      head at level 0, so this scenario does not test the outflow block; pump-from-empty-tank
      and break-tank do.)
    system:
      components:
        - {name: dut, type: tank, parameters: {diameter: 0.1, height: 0.5, initial_level: 0.05}}
        - {name: v, type: valve}
        - {name: sink, type: drain}
      connections:
        - [dut.outlet, v.port_a]
        - [v.port_b, sink.port]
    simulate: {duration: 60 s, step: 0.25 s}
    expect:
      - {variable: dut.level, max: 0.001}
      - {variable: dut.net_inflow, min: -1.0e-4, max: 1.0e-4}
      - {mode: dut, is: empty}
      - {warning: dut.tank_empty, present: true}
      - {warning: dut.low_level, present: true}
  - id: pump-from-empty-tank
    description: >-
      A default pump draws from an empty tank (level 0) and discharges through a Kv 15 valve
      to atmosphere; tank inlet capped. Outflow from an empty tank is blocked: only the gate
      leakage (1e-6 of the port Kv 200 m3/h) can pass, below 1e-3 m3/h even at the full
      shut-off suction of the pump (34 m, 3.3 bar: 200e-6 * sqrt(3.3) = 3.7e-4 m3/h). The
      pump runs dry and pulls its inlet below the vapour pressure.
    system:
      components:
        - {name: dut, type: tank, parameters: {initial_level: 0}}
        - {name: pump, type: centrifugal_pump}
        - {name: v, type: valve, parameters: {kv: 15}}
        - {name: sink, type: drain}
      connections:
        - [dut.outlet, pump.inlet]
        - [pump.outlet, v.port_a]
        - [v.port_b, sink.port]
    expect:
      - {variable: dut.net_inflow, min: -1.0e-3, max: 1.0e-9}
      - {variable: pump.volume_flow, min: -1.0e-3, max: 1.0e-3}
      - {mode: dut, is: empty}
      - {warning: dut.tank_empty, present: true}
      - {warning: dut.drawing_air, present: true}
      - {warning: pump.cavitation, present: true}
  - id: pump-lift-from-empty-tank
    description: >-
      A default pump draws from an empty tank and lifts through 60 m of 50 mm steel pipe
      rising 25 m to a free discharge (the rooftop-tank lift). The pump holds the 25 m column
      at shut-off (33.97 m head), so its inlet sits at 25 - 33.97 = -8.97 m, -0.878 bar gauge:
      NPSH available (10.35 - 8.97 - 0.17 = 1.2 m) stays positive, so the pump reports only
      low_flow. The empty tank cannot hold its outlet below atmospheric pressure; it raises
      drawing_air.
    system:
      components:
        - {name: dut, type: tank, parameters: {initial_level: 0}}
        - {name: pump, type: centrifugal_pump}
        - {name: riser, type: pipe, parameters: {length: 60, diameter: 50, roughness: 0.045, height_difference: 25}}
        - {name: sink, type: drain}
      connections:
        - [dut.outlet, pump.inlet]
        - [pump.outlet, riser.port_a]
        - [riser.port_b, sink.port]
    expect:
      - {variable: dut.outlet.p, value: -0.8781, abs_tol: 0.001}
      - {variable: pump.npsh_available, min: 1.0, max: 1.4}
      - {warning: dut.tank_empty, present: true}
      - {warning: dut.drawing_air, present: true}
      - {warning: pump.low_flow, present: true}
      - {warning: pump.cavitation, present: false}
  - id: break-tank
    description: >-
      Break tank: a 1 bar supply feeds an initially empty tank (1 m diameter) through a Kv 2.5
      valve while a default pump draws from it into a Kv 15 valve and a drain; 600 s at a
      1 s step. The feed is Kv_eff * sqrt(1 bar * 1000 / 998.2) = 2.4998047 * 1.0009012 =
      2.502 m3/h (the few mm of static head change it by under 0.02 %); the pump could draw
      23.9 m3/h but can deliver only what flows in. Each step may draw at most the water above
      the 1 mm empty level, shared by the two connected ports, so the level settles at
      1 mm + 2 Q dt / A = 0.001 + 2 * 6.95e-4 * 1 / 0.7854 = 2.77 mm and the pump delivers the
      feed: net inflow zero, no water created.
    system:
      components:
        - {name: src, type: supply, parameters: {pressure: 1.0}}
        - {name: vin, type: valve, parameters: {kv: 2.5}}
        - {name: dut, type: tank, parameters: {diameter: 1.0, initial_level: 0}}
        - {name: pump, type: centrifugal_pump}
        - {name: v, type: valve, parameters: {kv: 15}}
        - {name: sink, type: drain}
      connections:
        - [src.port, vin.port_a]
        - [vin.port_b, dut.inlet]
        - [dut.outlet, pump.inlet]
        - [pump.outlet, v.port_a]
        - [v.port_b, sink.port]
    simulate: {duration: 600 s, step: 1 s}
    expect:
      - {variable: pump.volume_flow, value: 2.502, rel_tol: 1.0e-3}
      - {variable: dut.net_inflow, value: 0.0, abs_tol: 1.0e-6}
      - {variable: dut.level, value: 0.00277, abs_tol: 2.0e-5}
      - {mode: dut, is: steady}
      - {warning: pump.cavitation, present: true}
  - id: warm-inflow-mixing
    description: >-
      A 1 bar, 40 degC supply fills a 1 m diameter tank holding 1 m of 15 degC water through a
      Kv 2.5 valve for 10 min; outlet capped. Perfect mixing without outflow conserves the
      volume-weighted temperature, V T = V0 T0 + (V - V0) T_in, with V0 = pi / 4 m3; about
      0.4 m3 enters, so the final temperature is near 22 degC.
    system:
      components:
        - {name: src, type: supply, parameters: {pressure: 1.0, temperature: 40}}
        - {name: v, type: valve}
        - {name: dut, type: tank, parameters: {diameter: 1.0, initial_level: 1.0, initial_temperature: 15}}
      connections:
        - [src.port, v.port_a]
        - [v.port_b, dut.inlet]
    simulate: {duration: 10 min, step: 5 s}
    expect:
      - {variable: dut.temperature, min: 20, max: 24}
      - {variable: dut.level, min: 1.4, max: 1.6}
      - {mode: dut, is: filling}
      - {warning: dut.tank_overflow, present: false}
  - id: top-fed-inlet
    description: >-
      A 0.5 bar supply fills the default tank (1 m of water) through a Kv 2.5 valve and a top
      inlet discharging at 2.5 m; outlet capped. The mouth is above the water, so the
      back-pressure is rho g 2.5 = 0.244725 bar whatever the level, and the valve and port
      (Kv_eff 2.4998047) pass Q = 2.4998047 * sqrt((0.5 - 0.244725) * 1000 / 998.2) =
      1.264158 m3/h. The inlet port (at the bottom datum) reads the mouth pressure plus the
      port drop (Q / 200)**2 * 0.9982: 0.2447648 bar.
    system:
      components:
        - {name: src, type: supply, parameters: {pressure: 0.5}}
        - {name: v, type: valve}
        - {name: dut, type: tank, parameters: {initial_level: 1.0, inlet_height: 2.5}}
      connections:
        - [src.port, v.port_a]
        - [v.port_b, dut.inlet]
    expect:
      - {variable: dut.net_inflow, value: 1.264158, rel_tol: 1.0e-5}
      - {variable: dut.inlet.p, value: 0.2447648, abs_tol: 1.0e-6}
      - {mode: dut, is: filling}
      - {warning: dut.drawing_air, present: false}
  - id: top-inlet-siphon
    description: >-
      The top inlet (mouth at 2 m) is connected through a Kv 2.5 valve to a drain at the tank
      bottom's level; outlet capped. With 1 m of water the mouth is dry: nothing flows back
      out through it (gate leakage only, under 1e-3 m3/h). The inlet pipe simply drains to
      the drain and fills with air; nothing pulls on it (the port is at atmospheric
      pressure), so drawing_air is not raised. Once the mouth is submerged the inlet siphons
      like a bottom port: at 2.5 m, Q = 2.4998047 * sqrt(998.2 g 2.5 / 1e5 * 1000 / 998.2) =
      1.237760 m3/h (see the contract top-inlet-siphons-when-submerged).
    system:
      components:
        - {name: dut, type: tank, parameters: {initial_level: 1.0, inlet_height: 2.0}}
        - {name: v, type: valve}
        - {name: sink, type: drain}
      connections:
        - [dut.inlet, v.port_a]
        - [v.port_b, sink.port]
    expect:
      - {variable: dut.net_inflow, min: -1.0e-3, max: 1.0e-9}
      - {variable: v.volume_flow, min: -1.0e-9, max: 0.017}
      - {mode: dut, is: steady}
      - {warning: dut.drawing_air, present: false}
      - {warning: dut.tank_empty, present: false}
  - id: pump-on-dry-top-inlet
    description: >-
      A default pump draws from the top inlet (mouth at 2 m) of a tank holding 1 m and
      discharges through a Kv 15 valve to a drain; outlet capped. The mouth is above the
      water, so the inlet cannot deliver (gate leakage only, 200e-6 * sqrt(3.3) = 3.8e-4
      m3/h at the pump's full shut-off suction): the pump pulls the port to about -3.3 bar
      gauge, runs dry and cavitates, and drawing_air is raised. With the mouth submerged
      (see the contract dry-top-inlet-under-suction-draws-air) the pump draws about
      24.6 m3/h and the port stays above atmospheric pressure.
    system:
      components:
        - {name: dut, type: tank, parameters: {initial_level: 1.0, inlet_height: 2.0}}
        - {name: pump, type: centrifugal_pump}
        - {name: v, type: valve, parameters: {kv: 15}}
        - {name: sink, type: drain}
      connections:
        - [dut.inlet, pump.inlet]
        - [pump.outlet, v.port_a]
        - [v.port_b, sink.port]
    expect:
      - {variable: pump.volume_flow, min: -1.0e-3, max: 1.0e-3}
      - {variable: dut.inlet.p, max: -3.0}
      - {warning: dut.drawing_air, present: true}
      - {warning: pump.cavitation, present: true}
  - id: top-inlet-siphon-stops-at-the-mouth
    description: >-
      The siphon of top-inlet-siphon in a simulation: a 0.5 m tank starting at 2.5 m, mouth
      at 2 m, drained through the inlet, a Kv 2.5 valve and a drain for 30 min at a 5 s
      step. The siphon takes the 0.098 m3 above the mouth at about 1.1 m3/h (the head is the
      whole level, not the water above the mouth, so the flow is still 1.107 m3/h when the
      mouth is reached) and stops there: each step may draw only the water above the mouth,
      so the level ends at the mouth (a few um below it: the closed gate's stiffness and
      leakage), not 8 mm below as one uncapped 5 s step at 1.1 m3/h would leave it.
    system:
      components:
        - {name: dut, type: tank, parameters: {diameter: 0.5, initial_level: 2.5, inlet_height: 2.0}}
        - {name: v, type: valve}
        - {name: sink, type: drain}
      connections:
        - [dut.inlet, v.port_a]
        - [v.port_b, sink.port]
    simulate: {duration: 30 min, step: 5 s}
    expect:
      - {variable: dut.level, min: 1.9999, max: 2.0}
      - {variable: v.volume_flow, min: -1.0e-9, max: 0.017}
      - {mode: dut, is: steady}
  - id: dry-top-inlet-takes-no-share
    description: >-
      A 0.5 m tank holding 10 mm is drained by a default pump on its outlet while its top
      inlet (mouth at 2 m, dry) is fed from a 0 bar supply that delivers nothing; one 10 s
      step. The pump would take about 30 m3/h, far above the water there is, so the outlet
      is held at the cap: the water above the empty level divided by the step. The dry inlet
      cannot draw and takes no share of the cap, so the outlet takes it all and the step
      ends at the empty level (1 mm); were the cap shared with the inlet, the level would end
      at (10 + 1) / 2 = 5.5 mm.
    system:
      components:
        - {name: src, type: supply, parameters: {pressure: 0}}
        - {name: vin, type: valve}
        - {name: dut, type: tank, parameters: {diameter: 0.5, initial_level: 0.010, inlet_height: 2.0}}
        - {name: pump, type: centrifugal_pump}
        - {name: sink, type: drain}
      connections:
        - [src.port, vin.port_a]
        - [vin.port_b, dut.inlet]
        - [dut.outlet, pump.inlet]
        - [pump.outlet, sink.port]
    simulate: {duration: 10 s, step: 10 s}
    expect:
      - {variable: dut.level, min: 0.00099, max: 0.001}
      - {mode: dut, is: empty}
      - {warning: dut.tank_empty, present: true}
      - {warning: dut.drawing_air, present: true}
  - id: top-fed-filling
    description: >-
      A 0.5 bar supply fills a 0.5 m diameter tank (A = 0.1963495 m2) from 0.5 m through a
      Kv 2.5 valve and a top inlet at 2 m, for 300 s at a 5 s step; outlet capped. Below the
      mouth the inflow is constant, 2.4998047 * sqrt((0.5 - 998.2 g 2 / 1e5) * 1000 / 998.2) =
      1.380039 m3/h = 23.00064 L/min, so explicit Euler is exact: V = 0.0981748 + 3.833440e-4
      * 300 = 0.2131780 m3, a level of 1.085707 m.
    system:
      components:
        - {name: src, type: supply, parameters: {pressure: 0.5}}
        - {name: v, type: valve}
        - {name: dut, type: tank, parameters: {diameter: 0.5, initial_level: 0.5, inlet_height: 2.0}}
      connections:
        - [src.port, v.port_a]
        - [v.port_b, dut.inlet]
    simulate: {duration: 300 s, step: 5 s}
    expect:
      - {variable: dut.level, value: 1.085707, rel_tol: 1.0e-6}
      - {variable: dut.volume, value: 0.2131780, rel_tol: 1.0e-6}
      - {variable: v.volume_flow, value: 23.00064, rel_tol: 1.0e-6}
      - {mode: dut, is: filling}
contracts:
  - id: mass-conservation
    description: The port mass flows add up to the net inflow at every level, including an empty tank.
    scenario: drain-through-valve
    sweep: {variable: dut.initial_level, values: [0, 0.0005, 0.5, 1, 2, 3]}
    check: {type: equal, left: dut.inlet.m_flow + dut.outlet.m_flow, right: dut.net_inflow * 998.2 / 3600, abs_tol: 1.0e-12, rel_tol: 1.0e-9}
  - id: torricelli-kv-law
    description: >-
      The drain flow equals the series Kv (2.4998047 m3/h, port and valve) times the square
      root of the static head in bar over the specific gravity, at every level. The tolerance
      covers the regularisation of the large port Kv near zero flow (below 0.11 kg/s its law
      is a C1 cubic; the port carries under 0.02 % of the drop here).
    scenario: drain-through-valve
    sweep: {variable: dut.initial_level, from: 0.1, to: 3, steps: 8}
    check:
      type: equal
      left: -dut.net_inflow
      right: "2.4998047103852 * sqrt(dut.level * 998.2 * 9.80665 / 1e5 * 1000 / 998.2)"
      rel_tol: 1.0e-4
  - id: outflow-increases-with-level
    description: A fuller tank drains faster through the same valve.
    scenario: drain-through-valve
    sweep: {variable: dut.initial_level, from: 0.1, to: 3, steps: 8}
    check: {type: monotonic, variable: dut.net_inflow, direction: decreasing, strict: true}
  - id: perfect-mixing
    description: >-
      Without outflow the volume-weighted temperature is conserved exactly by the mixing rule:
      T * V = 15 * V0 + T_supply * (V - V0) with V0 = pi / 4 m3, for any supply temperature.
    scenario: warm-inflow-mixing
    sweep: {variable: src.temperature, values: [5, 40, 80]}
    check:
      type: equal
      left: dut.temperature * dut.volume
      right: "15 * 0.7853981633974483 + src.temperature * (dut.volume - 0.7853981633974483)"
      rel_tol: 1.0e-9
  - id: tank-empty-warning
    description: >-
      The tank_empty warning is raised exactly when a pump cannot draw water out of the tank:
      at 1 mm or below the outflow is blocked (only leakage, net inflow above -0.001 m3/h);
      above it the pump draws its full flow (about 24 m3/h).
    scenario: pump-from-empty-tank
    sweep: {variable: dut.initial_level, values: [0, 0.0005, 0.001, 0.0015, 0.01, 2]}
    check: {type: warning_iff, code: dut.tank_empty, condition: "dut.net_inflow > -0.001"}
  - id: break-tank-delivers-the-feed
    description: >-
      A pump drawing from a break tank delivers exactly what flows into it, whatever the
      feed pressure (feed 1.77, 2.50 and 3.54 m3/h at 0.5, 1 and 2 bar): mass is conserved
      through the nearly empty tank. The valve flow is in L/min, the pump flow in m3/h.
    scenario: break-tank
    sweep: {variable: src.pressure, values: [0.5, 1.0, 2.0]}
    check: {type: equal, left: pump.volume_flow, right: vin.volume_flow * 0.06, rel_tol: 1.0e-4}
  - id: drawing-air-warning
    description: >-
      drawing_air is raised exactly when the tank is empty and its outlet is under suction
      (the pump holds the 25 m column, -0.88 bar at the outlet); with water in the tank the
      pump lifts it and the outlet stays above atmospheric pressure.
    scenario: pump-lift-from-empty-tank
    sweep: {variable: dut.initial_level, values: [0, 0.0005, 0.001, 0.0015, 0.5, 2]}
    check: {type: warning_iff, code: dut.drawing_air, condition: "dut.level <= 0.001 and dut.outlet.p < -0.001"}
  - id: overflow-warning
    description: >-
      The tank overflows exactly when the supply can push water in against the head of the
      full tank, 998.2 * 9.80665 * 1 / 1e5 = 0.0979 bar at 1 m. At 0.05 and 0.09 bar (below
      the head at the starting level, 0.0969 bar) the tank drains back into the supply
      instead; at 0.11 bar the net inflow is about 0.27 m3/h and fills the last centimetre
      in under 30 s.
    scenario: fill-to-overflow
    sweep: {variable: src.pressure, values: [0.05, 0.09, 0.11, 0.2, 0.5, 1.0]}
    check: {type: warning_iff, code: dut.tank_overflow, condition: "src.pressure > 0.0979"}
  - id: top-inlet-flow-independent-of-level
    description: >-
      While the level is below the top inlet's mouth (2.5 m) the inflow is the same
      1.264158 m3/h at every level, from an empty tank to just below the mouth.
    scenario: top-fed-inlet
    sweep: {variable: dut.initial_level, values: [0, 0.5, 1, 2, 2.49]}
    check: {type: equal, left: dut.net_inflow, right: 1.264158, rel_tol: 1.0e-5}
  - id: submerged-top-inlet-matches-bottom-fed
    description: >-
      With the mouth submerged the inflow is that of a bottom inlet, the series Kv 2.4998047
      times sqrt((0.5 bar - rho g level) / specific gravity), at every level from the mouth
      (2.5 m) to the rim.
    scenario: top-fed-inlet
    sweep: {variable: dut.initial_level, values: [2.5, 2.6, 2.8, 3]}
    check:
      type: equal
      left: dut.net_inflow
      right: "2.4998047103852 * sqrt((0.5 - dut.level * 998.2 * 9.80665 / 1e5) * 1000 / 998.2)"
      rel_tol: 1.0e-5
  - id: no-backflow-through-a-dry-top-inlet
    description: >-
      While the mouth (2 m) is above the water nothing flows back out through the inlet
      (leakage below 1e-3 m3/h), whatever the level; a bottom port at the same levels would
      drain 0.8 to 1.2 m3/h.
    scenario: top-inlet-siphon
    sweep: {variable: dut.initial_level, values: [0, 0.5, 1, 1.5, 1.99]}
    check: {type: bounds, variable: dut.net_inflow, min: -1.0e-3, max: 1.0e-9}
  - id: top-inlet-siphons-when-submerged
    description: >-
      With the mouth submerged the inlet drains the tank like a bottom port, through the
      series Kv 2.4998047 under the head of the level.
    scenario: top-inlet-siphon
    sweep: {variable: dut.initial_level, values: [2.01, 2.5, 3]}
    check:
      type: equal
      left: -dut.net_inflow
      right: "2.4998047103852 * sqrt(dut.level * 998.2 * 9.80665 / 1e5 * 1000 / 998.2)"
      rel_tol: 1.0e-5
  - id: dry-top-inlet-under-suction-draws-air
    description: >-
      drawing_air is raised exactly when the top inlet's mouth is above the water while the
      pump pulls its port below atmospheric pressure; with the mouth submerged the pump
      draws about 24.6 m3/h and the port stays above atmospheric.
    scenario: pump-on-dry-top-inlet
    sweep: {variable: dut.initial_level, values: [0.5, 1, 1.99, 2.01, 2.5, 3]}
    check: {type: warning_iff, code: dut.drawing_air, condition: "dut.level < dut.inlet_height and dut.inlet.p < -0.001"}
  - id: dry-top-inlet-without-suction-is-not-drawing-air
    description: >-
      A dry top inlet whose port is not under suction (piped down to a drain at the bottom's
      level, so the port is at atmospheric pressure) is never flagged: nothing flows and
      the result is exact, at any level below or above the mouth.
    scenario: top-inlet-siphon
    sweep: {variable: dut.initial_level, values: [0.5, 1, 1.99, 2.01, 2.5, 3]}
    check: {type: warning_iff, code: dut.drawing_air, condition: "false"}
  - id: top-fed-volume-balance
    description: >-
      Over 300 s of filling below the mouth the tank gains exactly the inflow times the time,
      V = 0.0981748 m3 + Q * 300 s, at every supply pressure (the inflow, read from the valve
      in L/min, is constant while the mouth is dry).
    scenario: top-fed-filling
    sweep: {variable: src.pressure, values: [0.3, 0.4, 0.5]}
    check:
      type: equal
      left: dut.volume
      right: "0.19634954084936207 * 0.5 + v.volume_flow / 60000 * 300"
      rel_tol: 1.0e-9
  - id: low-level-info
    description: The low_level info is raised exactly when the level is below 10 % of the height (0.3 m of the default 3 m).
    scenario: drain-through-valve
    sweep: {variable: dut.initial_level, values: [0, 0.1, 0.29, 0.31, 1, 3]}
    check: {type: warning_iff, code: dut.low_level, condition: "dut.level < 0.1 * dut.height"}
implementations:
  reference: {python: "worldparts.components.tank:Tank"}
  modelica:
    class: Modelica.Fluid.Vessels.OpenTank
    library: Modelica Standard Library 4.0.0
    notes: >-
      OpenTank with crossArea = pi * diameter**2 / 4, height, level_start and two bottom ports
      (portsData with height 0 and a diameter that reproduces port_kv). MSL models the port
      velocity head and has no Kv port resistance or spill accounting, so small differences are
      expected. Binding not yet cross-validated in v0.1.
  wntr:
    element: Tank
    notes: >-
      Cylindrical tank (worldparts.adapters.wntr_adapter) with elevation at the datum,
      diameter, init_level = level (0 up to 1 mm), min_level 0, max_level = height and the
      overflow option; each connected port is a TCV for port_kv. Cross-validated in
      docs/wntr-adapter.md. EPANET ignores temperature, and its tank inlets are at the
      bottom: a top inlet (inlet_height above the level) is exported bottom-fed and listed
      as an approximation.
provenance:
  authors: [worldparts contributors]
  sources:
    - title: "White, F. M. Fluid Mechanics. McGraw-Hill."
      notes: Hydrostatics, the quasi-steady draining of a tank (Torricelli with losses) and its analytic solution.
    - title: "IEC 60534-2-1: Industrial-process control valves - Part 2-1: Flow capacity - Sizing equations for fluid flow under installed conditions"
      notes: Definition of the flow coefficient Kv used for the port connections.
    - title: Modelica Standard Library (Modelica.Fluid.Vessels.OpenTank)
      url: https://github.com/modelica/ModelicaStandardLibrary
      notes: Reference open-tank model with bottom ports, level state and perfect mixing.
    - title: EPANET
      url: https://github.com/OpenWaterAnalytics/EPANET
      notes: Storage tanks in water network models (level from net inflow, full tank closed to inflow).
  data:
    acquisition: generic
    notes: Default geometry (2 m diameter, 3 m high, 2 m level) and port Kv 200 m3/h (roughly a DN80 to DN100 nozzle) are generic illustrative values, not a specific product.
  license: Apache-2.0
  data_license: CC0-1.0
